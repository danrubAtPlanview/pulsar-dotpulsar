deviations:
  # Mirror of 12-risks-open-questions.md §2. Keep the two in sync.
  - { id: X1, summary: "Async SemaphoreSlim instead of blocking Semaphore for max pending TC ops" }
  - { id: X2, summary: "TC client starts lazily on first CreateTransaction; retryable" }
  - { id: X3, summary: "TC responses correlated by per-connection request_id, not routed by txnid_most_bits" }
  - { id: X4, summary: "Pending TC ops resent with a new request id after reconnect" }
  - { id: X5, summary: "MetaStoreHandlerNotExists/NotReady messages interpolate the tc id (Java has a literal {})" }
  - { id: X6, summary: "Flat sealed exception types" }
  - { id: X7, summary: "AlreadyClosedException maps to PulsarClientClosedException" }
  - { id: X8, summary: "newMessage(Schema, Transaction) not applicable" }
  - { id: X9, summary: "Transaction timeout <= 0 rejected" }
  - { id: X10, summary: "InvalidTxnStatus on client commands maps to InvalidTransactionStatusException" }

