# Upstream traceability map for the DotPulsar transactions port.
# The schema and the sync procedure are described in 11-upstream-sync.md.
# Line numbers refer to the pinned SHAs below.
#
# status values:
#   components: planned | ported | adapted | deviated | excluded
#   tests:      Port | Port-partial | Port-unit | Excluded | Sample (plus detail). Set "done: true" when the C# test lands.
#               done: true only when the C# test exists and is not skipped (or the sample exists); false for missing, skipped and pending-wp9-producer rows; omitted for Excluded rows.
#               note: only where a row deviates (missing, skipped, pending-wp9-producer, weakened, stale exclusion, extra or fewer rows). csharp: null when no test exists.
#               The tests of TransactionEndToEnd* are named by their post-merge file TransactionEndToEndTests.cs.
#
# For client-unit tests, tests[].csharp names the primary file only. The detailed spec (tests[].spec) decides placement.
# The ~240-method classification sweep is in 08-tests/tests-client.md §5; only its Port, Port-partial and Port-unit rows are repeated here (note: sweep section 5).
# The tests of 06-prerequisites/*.md have spec: 06-prerequisites/<file>.md. Rows named after Java main-code members (ConsumerImpl#..., ProducerImpl#...), the grouped C++ rows and the websocket row are not listed.
